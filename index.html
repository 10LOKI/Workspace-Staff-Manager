<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">
    
    <title>Workspace Staff Manager</title>
    
    <link rel="icon" href="images/logo1.png" type="image/png">
</head>
<body>
    <div class="mainContainer">
        <nav class="navBar">
            <div class="logo">
                <h2>Workspace 4U</h2>
            </div>
        </nav>

        <div class="staffList">
            <button id="addEmployee">Ajouter un employer</button>
            <div class="list"></div>
        </div>

        <div class="modal">
            <input type="text" placeholder="nom">
            <input type="text" placeholder="role">
            <input type="file" placeholder="Photo">
            <input type="text" placeholder="Email">
            <input type="text" placeholder="telephone">
            <input type="text" placeholder="experience">
        </div>

        <div class="etageScheme">
            <div class="salleConf">
                <p>Salle de conférence</p>
                <label for="myDropdown">choisir un employant</label>
                <select id="myDropdown" name="myOption">
                    <option value="option1" selected>Aladdin</option>
                </select>
            </div>
            <div class="recepPlace">
                <p>Réception</p>
            <label for="myDropdown">choisir un employant</label>
                <select id="myDropdown" name="myOption">
                    <option value="option1" selected>Aladdin</option>
                </select>
            </div>
            <div class="salleServeurs">
                <p>Salle des serveurs</p>
            <label for="myDropdown">choisir un employant</label>
                <select id="myDropdown" name="myOption">
                    <option value="option1" selected>Aladdin</option>
                </select>
            </div>
            <div class="salleSecurite">
                <p>Salle de sécurité</p>
            <label for="myDropdown">choisir un employant</label>
                <select id="myDropdown" name="myOption">
                    <option value="option1" selected>Aladdin</option>
                </select>
            </div>
            <div class="sallePersonnel">
                <p>Salle du personnel</p>
            <label for="myDropdown">choisir un employant</label>
                <select id="myDropdown" name="myOption">
                    <option value="option1" selected>Aladdin</option>
                </select>
            </div>
            <div class="salleArchive">
                <p>Salle d’archives</p>
            <label for="myDropdown">choisir un employant</label>
                <select id="myDropdown" name="myOption">
                    <option value="option1" selected>Aladdin</option>
                </select>
            </div>
        </div>

    
    </div>
    <script src="script.js"></script>
</body>
</html>
