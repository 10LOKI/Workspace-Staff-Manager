<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Workspace Staff Manager</title>
</head>

<body>
    <div class="mainContainer">
        <nav class="navBar">
            <div class="logo">
                <h2>Workspace 4U</h2>
            </div>
        </nav>

        <div class="staffList">
            <button id="addEmployee">Ajouter un employer</button>
            <div class="list"></div>
        </div>

        <div class="modal hidden">
            <div class="modal-header">
                <h2>Ajoute employee</h2>
                <span id="closeIcon" class="close">&times;</span>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label>Nom:</label>
                    <input id="nomInput" type="text" placeholder="Entre nom">
                    <span class="error" id="nomError"></span>
                </div>

                <div class="form-group">
                    <label>Role:</label>
                    <select id="selected">
                        <option>Receptioniste</option>
                        <option>agent de securite</option>
                        <option>directeur</option>
                        <option>Femme de manage</option>
                        <option>sucretaire</option>
                        <option>Technicien</option>
                        <option>responsable RH</option>
                        <option>Manager</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Photo (URL):</label>
                    <input type="text" placeholder="https://example.com/photo.jpg" id="photoInput">
                </div>
                <div class="form-group">
                    <label>Experiences:</label>
                    <div class="experiences-container">
                        <div class="experience-item">
                            <div class="form-group">
                                <label>Societe:</label>
                                <input class="exp-societe" type="text" placeholder="Enter company">
                            </div>
                            <div class="form-group">
                                <label>Role:</label>
                                <input class="exp-role" type="text" placeholder="Enter role">
                            </div>
                            <div class="row-inputs">
                                <div class="form-group">
                                    <label>Du:</label>
                                    <input class="exp-du" type="date">
                                </div>
                                <div class="form-group">
                                    <label>A:</label>
                                    <input class="exp-a" type="date">
                                </div>
                            </div>
                        </div>
                    </div>
                    <button id="experienceBtn">Ajouter experience</button>
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email"  id="emailInput" placeholder="email@example.com">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label>Telephone:</label>
                    <input id="telephoneInput" type="text" placeholder="+212 655112255">
                    <span class="error" id="telephoneError"></span>
                </div>
            </div>

            <div class="modal-footer">
                <button id="submitBtn">Ajouter</button>
                <button id="closeModal">Annuler</button>
            </div>
        </div>

        <div class="etageScheme">
            <div class="salleConf" data-room="Salle de conférence">
                <p>Salle de conférence</p>
                <label>choisir un employant</label>
                <select class="room-select" name="myOption" data-room="Salle de conférence">
                    <option value="option1" selected>Selectionner</option>
                </select>
                <div class="occupied-list"></div>
            </div>
            <div class="recepPlace" data-room="Reception">
                <p>Réception</p>
                <label >choisir un employant</label>
                <select class="room-select" name="myOption" data-room="Reception">
                    <option value="option1" selected>Selectionner</option>
                </select>
                <div class="occupied-list"></div>
            </div>
            <div class="salleServeurs" data-room="salle serveurs">
                <p>Salle des serveurs</p>
                <label >choisir un employant</label>
                <select class="room-select" name="myOption" data-room="salle serveurs">
                    <option value="option1" selected>Selectionner</option>
                </select>
                <div class="occupied-list"></div>
            </div>
            <div class="salleSecurite" data-room="salle de securite">
                <p>Salle de sécurité</p>
                <label>choisir un employant</label>
                <select class="room-select" name="myOption" data-room="salle de securite">
                    <option value="option1" selected>Selectionner</option>
                </select>
                <div class="occupied-list"></div>
            </div>
            <div class="sallePersonnel" data-room="salle du personnel">
                <p>Salle du personnel</p>
                <label>choisir un employant</label>
                <select class="room-select" name="myOption" data-room="salle du personnel">
                    <option value="option1" selected>Selectionner</option>
                </select>
                <div class="occupied-list"></div>
            </div>
            <div class="salleArchive" data-room="salle d'archives">
                <p>Salle d’archives</p>
                <label>choisir un employant</label>
                <select class="room-select" name="myOption" data-room="salle d'archives">
                    <option value="option1" selected>Selectionner</option>
                </select>
                <div class="occupied-list"></div>
            </div>
        </div>
    </div>
    <div id="workerModal" class="modalDesc">
    <div class="modal-content-desc">
        <span class="close-button-desc">&times;</span>
        <h2>Description de l'Employé</h2>
        <pre id="workerDetails"></pre>
    </div>
</div>
    <script src="script.js"></script>
</body>

</html>
